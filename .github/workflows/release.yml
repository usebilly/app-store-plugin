name: Release

# Run manually from the Actions tab: pick patch/minor/major.
# This bumps version in plugin.json, commits and tags it, then publishes a GitHub release with a `*.billyplugin.zip` asset.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increment
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Bump version in plugin.json
        id: bump
        run: |
          IFS=. read -r major minor patch <<< "$(jq -r '.version' plugin.json)"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="${major}.${minor}.${patch}"
          jq --arg v "$version" '.version = $v' plugin.json > plugin.tmp && mv plugin.tmp plugin.json
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Release version ${{ steps.bump.outputs.version }}."
          git tag "${{ steps.bump.outputs.version }}"
          git push origin HEAD --tags

      - name: Bundle .billyplugin.zip
        run: |
          slug="$(jq -r '.name' plugin.json | tr ' ' '-')"
          git archive --format=zip --prefix="${slug}.billyplugin/" \
            -o "${slug}.billyplugin.zip" HEAD -- . ':!.github'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.version }}
          name: ${{ steps.bump.outputs.version }}
          files: '*.billyplugin.zip'
          generate_release_notes: true
